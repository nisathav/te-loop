document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"color:#F2D65C;\">// The gap<\u002Fspan><span style=\"color:#7A8BAA;\">Sec. B<\u002Fspan><\u002Fdiv>\n<div data-reveal=\"true\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(24px,4vw,56px);align-items:end;\">\n<h2 style=\"margin:0;font-size:clamp(34px,4.6vw,56px);line-height:1;font-weight:500;letter-spacing:-0.015em;text-wrap:balance;\">Models don't need more of the same.<\u002Fh2>\n<p style=\"margin:0;font-size:clamp(17px,1.6vw,19px);line-height:1.55;color:#93A3BC;text-wrap:pretty;\">Robot models are limited by data diversity, not volume. They need real environments, failure and recovery moments, and contact-rich interaction. Wearables capture what people see, but not what their hands feel.<\u002Fp>\n<\u002Fdiv>\n<div data-reveal=\"true\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border-top:1px solid rgba(150,180,220,0.35);border-left:1px solid rgba(150,180,220,0.2);\">\n<div style=\"padding:24px;border-right:1px solid rgba(150,180,220,0.2);border-bottom:1px solid rgba(150,180,220,0.2);display:flex;flex-direction:column;gap:28px;\">\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#F2D65C;letter-spacing:.12em;\">B.A<\u002Fspan>\n<svg sc-camel-view-box=\"0 0 140 48\" width=\"140\" height=\"48\" style=\"display:block;overflow:visible;\"><rect x=\"2\" y=\"16\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#DCE6F2\"><\u002Frect><circle cx=\"40\" cy=\"24\" r=\"9\" fill=\"none\" stroke=\"#DCE6F2\"><\u002Fcircle><rect x=\"62\" y=\"17\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#7CF5B0\" transform=\"rotate(45 69 24)\"><\u002Frect><polygon points=\"94,33 103,15 112,33\" fill=\"none\" stroke=\"#DCE6F2\"><\u002Fpolygon><rect x=\"124\" y=\"12\" width=\"14\" height=\"24\" fill=\"none\" stroke=\"#DCE6F2\"><\u002Frect><\u002Fsvg>\n<span style=\"font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;\">Diversity<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:24px;border-right:1px solid rgba(150,180,220,0.2);border-bottom:1px solid rgba(150,180,220,0.2);display:flex;flex-direction:column;gap:28px;\">\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#F2D65C;letter-spacing:.12em;\">B.B<\u002Fspan>\n<svg sc-camel-view-box=\"0 0 140 48\" width=\"140\" height=\"48\" style=\"display:block;overflow:visible;\"><polyline points=\"0,14 46,14 64,40 82,14 140,14\" fill=\"none\" stroke=\"#DCE6F2\"><\u002Fpolyline><circle cx=\"64\" cy=\"40\" r=\"4\" fill=\"#0B1424\" stroke=\"#7CF5B0\"><\u002Fcircle><line x1=\"0\" y1=\"46\" x2=\"140\" y2=\"46\" stroke=\"rgba(150,180,220,0.3)\" stroke-dasharray=\"2 4\"><\u002Fline><\u002Fsvg>\n<span style=\"font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;\">Failures &amp; recoveries<\u002Fspan>\n<\u002Fdiv>\n<div style=\"padding:24px;border-right:1px solid rgba(150,180,220,0.2);border-bottom:1px solid rgba(150,180,220,0.2);display:flex;flex-direction:column;gap:28px;\">\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#F2D65C;letter-spacing:.12em;\">B.C<\u002Fspan>\n<svg sc-camel-view-box=\"0 0 140 48\" width=\"140\" height=\"48\" style=\"display:block;overflow:visible;\"><line x1=\"70\" y1=\"0\" x2=\"70\" y2=\"26\" stroke=\"#7CF5B0\"><\u002Fline><polygon points=\"65,22 75,22 70,31\" fill=\"#7CF5B0\"><\u002Fpolygon><polyline points=\"10,38 56,38 70,44 84,38 130,38\" fill=\"none\" stroke=\"#DCE6F2\"><\u002Fpolyline><line x1=\"10\" y1=\"30\" x2=\"10\" y2=\"46\" stroke=\"#DCE6F2\"><\u002Fline><line x1=\"130\" y1=\"30\" x2=\"130\" y2=\"46\" stroke=\"#DCE6F2\"><\u002Fline><\u002Fsvg>\n<span style=\"font-size:26px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;\">Touch and force<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"offer\" data-screen-label=\"What we offer\" style=\"border-top:1px solid rgba(150,180,220,0.35);padding:clamp(56px,8vw,104px) clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:clamp(32px,5vw,56px);scroll-margin-top:72px;\">\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;\"><span style=\"color:#F2D65C;\">// What we offer<\u002Fspan><span style=\"color:#7A8BAA;\">Sec. C<\u002Fspan><\u002Fdiv>\n<div data-reveal=\"true\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(24px,4vw,56px);align-items:end;\">\n<h2 style=\"margin:0;font-size:clamp(34px,4.6vw,56px);line-height:1;font-weight:500;letter-spacing:-0.015em;text-wrap:balance;\">High-fidelity data for the hardest problems in robot learning.<\u002Fh2>\n<p style=\"margin:0;font-size:clamp(17px,1.6vw,19px);line-height:1.55;color:#93A3BC;text-wrap:pretty;\">From real-world capture today to engineered tactile data tomorrow: three ways we feed robot learning.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));column-gap:20px;row-gap:0;margin-bottom:-20px;\">\n<div data-reveal=\"true\" style=\"grid-row:span 5;display:grid;grid-template-rows:subgrid;row-gap:0;border:1px solid rgba(150,180,220,0.35);background:rgba(14,26,46,0.75);margin-bottom:20px;\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(150,180,220,0.2);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;\"><span style=\"color:#7A8BAA;\">PILLAR A<\u002Fspan><span style=\"color:#F2D65C;\">C.A<\u002Fspan><\u002Fdiv>\n<div style=\"padding-top:24px;padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid rgba(150,180,220,0.2);background-image:repeating-linear-gradient(135deg,rgba(150,180,220,0.04) 0 1px,transparent 1px 10px);\"><svg sc-camel-view-box=\"0 0 60 56\" width=\"72\" height=\"67\" style=\"display:block;overflow:visible;\"><rect x=\"4\" y=\"14\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><circle cx=\"34\" cy=\"21\" r=\"7\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fcircle><polygon points=\"46,28 52,14 58,28\" fill=\"none\" stroke=\"#7CF5B0\" stroke-width=\"1.25\"><\u002Fpolygon><rect x=\"8\" y=\"36\" width=\"10\" height=\"16\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><rect x=\"24\" y=\"40\" width=\"22\" height=\"12\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><circle cx=\"54\" cy=\"46\" r=\"5\" fill=\"none\" stroke=\"#F2D65C\" stroke-width=\"1.25\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n<div style=\"padding-top:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);font-size:clamp(24px,2.4vw,30px);line-height:1.05;font-weight:600;letter-spacing:.01em;text-wrap:balance;\">REAL-WORLD DATA COLLECTION<\u002Fdiv>\n<div style=\"padding-top:20px;padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;gap:8px;min-height:11.5em;box-sizing:border-box;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;\">WHY IT MATTERS<\u002Fdiv>\n<p style=\"margin:0;font-size:17px;line-height:1.5;color:#93A3BC;text-wrap:pretty;\">Models fail when they meet a layout, tool or object they have never seen. Most current data comes from the same Western settings, and diversity matters more than volume.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;padding-bottom:8px;border-bottom:1px solid rgba(150,180,220,0.25);\">WHAT WE DO<\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Recruit, train and equip local experts to record real work in repair, food preparation, light manufacturing, construction and agriculture.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Capture egocentric video and task data across real Sri Lankan homes, workshops and businesses, in both cities and villages.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Record different layouts, lighting, objects and workflows, including slips, corrections and recoveries, not just clean successes.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Use the partner's devices and process, with every device calibrated and every clip quality-checked before submission.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-reveal=\"true\" style=\"grid-row:span 5;display:grid;grid-template-rows:subgrid;row-gap:0;border:1px solid rgba(150,180,220,0.35);background:rgba(14,26,46,0.75);margin-bottom:20px;\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(150,180,220,0.2);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;\"><span style=\"color:#7A8BAA;\">PILLAR B<\u002Fspan><span style=\"color:#F2D65C;\">C.B<\u002Fspan><\u002Fdiv>\n<div style=\"padding-top:24px;padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid rgba(150,180,220,0.2);background-image:repeating-linear-gradient(135deg,rgba(150,180,220,0.04) 0 1px,transparent 1px 10px);\"><svg sc-camel-view-box=\"0 0 60 56\" width=\"72\" height=\"67\" style=\"display:block;overflow:visible;\"><rect x=\"2\" y=\"24\" width=\"16\" height=\"12\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><line x1=\"6\" y1=\"40\" x2=\"14\" y2=\"40\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fline><line x1=\"20\" y1=\"30\" x2=\"38\" y2=\"30\" stroke=\"#7A8BAA\" stroke-dasharray=\"2 3\"><\u002Fline><path d=\"M24,22 Q29,17 34,22\" fill=\"none\" stroke=\"#F2D65C\" stroke-width=\"1.25\"><\u002Fpath><path d=\"M21,17 Q29,9 37,17\" fill=\"none\" stroke=\"#F2D65C\" stroke-width=\"1.25\"><\u002Fpath><rect x=\"40\" y=\"36\" width=\"16\" height=\"8\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><line x1=\"48\" y1=\"36\" x2=\"48\" y2=\"24\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fline><line x1=\"48\" y1=\"24\" x2=\"56\" y2=\"18\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fline><circle cx=\"48\" cy=\"24\" r=\"2\" fill=\"#0B1424\" stroke=\"#DCE6F2\"><\u002Fcircle><rect x=\"54\" y=\"14\" width=\"5\" height=\"5\" fill=\"#7CF5B0\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n<div style=\"padding-top:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);font-size:clamp(24px,2.4vw,30px);line-height:1.05;font-weight:600;letter-spacing:.01em;text-wrap:balance;\">TELEOPERATION AS A SERVICE<\u002Fdiv>\n<div style=\"padding-top:20px;padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;gap:8px;min-height:11.5em;box-sizing:border-box;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;\">WHY IT MATTERS<\u002Fdiv>\n<p style=\"margin:0;font-size:17px;line-height:1.5;color:#93A3BC;text-wrap:pretty;\">Labs are moving beyond simple pick-and-place. Models need to learn complete multi-step tasks such as organising a kitchen, setting a table or assisting in a home, and that data takes skilled operators and time.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;padding-bottom:8px;border-bottom:1px solid rgba(150,180,220,0.25);\">WHAT WE DO<\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Trained engineering operators who follow complex, multi-step instructions precisely.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Remote piloting of partner robots over low-latency links, plus local demonstrations in replica environments (kitchen, workshop, light-assembly).<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Follow-the-sun operation: capture and verification continue while partner teams in the US and EU are offline.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Human-in-the-loop verification that keeps successes and meaningful failures, all documented.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-reveal=\"true\" style=\"grid-row:span 5;display:grid;grid-template-rows:subgrid;row-gap:0;border:1px solid rgba(150,180,220,0.35);background:rgba(14,26,46,0.75);margin-bottom:20px;\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(150,180,220,0.2);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;\"><span style=\"color:#7A8BAA;\">PILLAR C<\u002Fspan><span style=\"color:#F2D65C;\">C.C<\u002Fspan><\u002Fdiv>\n<div style=\"padding-top:24px;padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid rgba(150,180,220,0.2);background-image:repeating-linear-gradient(135deg,rgba(150,180,220,0.04) 0 1px,transparent 1px 10px);\"><svg sc-camel-view-box=\"0 0 60 56\" width=\"72\" height=\"67\" style=\"display:block;overflow:visible;\"><rect x=\"6\" y=\"20\" width=\"44\" height=\"28\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><line x1=\"17\" y1=\"20\" x2=\"17\" y2=\"48\" stroke=\"#7A8BAA\"><\u002Fline><line x1=\"28\" y1=\"20\" x2=\"28\" y2=\"48\" stroke=\"#7A8BAA\"><\u002Fline><line x1=\"39\" y1=\"20\" x2=\"39\" y2=\"48\" stroke=\"#7A8BAA\"><\u002Fline><line x1=\"6\" y1=\"34\" x2=\"50\" y2=\"34\" stroke=\"#7A8BAA\"><\u002Fline><rect x=\"20\" y=\"26\" width=\"5\" height=\"5\" fill=\"#7CF5B0\"><\u002Frect><rect x=\"31\" y=\"37\" width=\"5\" height=\"5\" fill=\"#7CF5B0\"><\u002Frect><line x1=\"28\" y1=\"2\" x2=\"28\" y2=\"12\" stroke=\"#F2D65C\" stroke-width=\"1.5\"><\u002Fline><polygon points=\"24,11 32,11 28,17\" fill=\"#F2D65C\"><\u002Fpolygon><\u002Fsvg><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#F2D65C;border:1px dashed #F2D65C;padding:6px 10px;\">Engineered capture: in development<\u002Fspan><\u002Fdiv>\n<div style=\"padding-top:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);font-size:clamp(24px,2.4vw,30px);line-height:1.05;font-weight:600;letter-spacing:.01em;text-wrap:balance;\">TACTILE &amp; DEXTEROUS MANIPULATION DATA<\u002Fdiv>\n<div style=\"padding-top:20px;padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;gap:8px;min-height:11.5em;box-sizing:border-box;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;\">WHY IT MATTERS<\u002Fdiv>\n<p style=\"margin:0;font-size:17px;line-height:1.5;color:#93A3BC;text-wrap:pretty;\">Robot models have plenty of vision data but hit a \"dexterity wall\" on delicate work like handling wires, soft materials and precise assembly. What's missing is touch and force.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding-bottom:24px;padding-left:clamp(20px,2.6vw,28px);padding-right:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;padding-bottom:8px;border-bottom:1px solid rgba(150,180,220,0.25);\">WHAT WE DO<\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Design and build sensor-rich capture rigs that record tactile and force feedback alongside vision.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Capture two-handed coordination and contact-rich manipulation.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Validate every rig in simulation and hardware-in-the-loop before it is built.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:11px 0;\"><div style=\"width:6px;height:6px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:16px;line-height:1.45;\">Co-develop rigs with partners around the specific gaps their customers are asking about.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-reveal=\"true\" style=\"display:flex;flex-direction:column;gap:14px;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#7A8BAA;\">HOW WE DELIVER<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));border-top:1px solid rgba(150,180,220,0.35);border-left:1px solid rgba(150,180,220,0.2);\">\n<div style=\"display:flex;align-items:center;gap:14px;padding:16px 18px;border-right:1px solid rgba(150,180,220,0.2);border-bottom:1px solid rgba(150,180,220,0.2);\"><svg sc-camel-view-box=\"0 0 28 28\" width=\"28\" height=\"28\" style=\"display:block;flex:none;overflow:visible;\"><circle cx=\"14\" cy=\"9\" r=\"5\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fcircle><path d=\"M4,26 Q14,12 24,26\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fpath><\u002Fsvg><span style=\"font-size:17px;font-weight:500;line-height:1.2;\">Expert recruitment &amp; training<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:16px 18px;border-right:1px solid rgba(150,180,220,0.2);border-bottom:1px solid rgba(150,180,220,0.2);\"><svg sc-camel-view-box=\"0 0 28 28\" width=\"28\" height=\"28\" style=\"display:block;flex:none;overflow:visible;\"><rect x=\"4\" y=\"4\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><line x1=\"14\" y1=\"0\" x2=\"14\" y2=\"28\" stroke=\"#7A8BAA\"><\u002Fline><line x1=\"0\" y1=\"14\" x2=\"28\" y2=\"14\" stroke=\"#7A8BAA\"><\u002Fline><circle cx=\"14\" cy=\"14\" r=\"3\" fill=\"none\" stroke=\"#7CF5B0\" stroke-width=\"1.5\"><\u002Fcircle><\u002Fsvg><span style=\"font-size:17px;font-weight:500;line-height:1.2;\">Device staging &amp; calibration<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:16px 18px;border-right:1px solid rgba(150,180,220,0.2);border-bottom:1px solid rgba(150,180,220,0.2);\"><svg sc-camel-view-box=\"0 0 28 28\" width=\"28\" height=\"28\" style=\"display:block;flex:none;overflow:visible;\"><rect x=\"4\" y=\"4\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Frect><polyline points=\"9,14 13,19 20,9\" fill=\"none\" stroke=\"#7CF5B0\" stroke-width=\"2\"><\u002Fpolyline><\u002Fsvg><span style=\"font-size:17px;font-weight:500;line-height:1.2;\">In-house quality control<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px;padding:16px 18px;border-right:1px solid rgba(150,180,220,0.2);border-bottom:1px solid rgba(150,180,220,0.2);\"><svg sc-camel-view-box=\"0 0 28 28\" width=\"28\" height=\"28\" style=\"display:block;flex:none;overflow:visible;\"><line x1=\"2\" y1=\"14\" x2=\"17\" y2=\"14\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fline><polygon points=\"15,10 22,14 15,18\" fill=\"#7CF5B0\"><\u002Fpolygon><polyline points=\"22,4 26,4 26,24 22,24\" fill=\"none\" stroke=\"#DCE6F2\" stroke-width=\"1.25\"><\u002Fpolyline><\u002Fsvg><span style=\"font-size:17px;font-weight:500;line-height:1.2;\">Documented delivery<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-reveal=\"true\" style=\"border-top:1px solid rgba(150,180,220,0.35);padding-top:clamp(24px,3vw,40px);\">\n<p style=\"margin:0;font-size:clamp(28px,3.6vw,46px);line-height:1.05;font-weight:500;letter-spacing:-0.015em;text-wrap:balance;\">Solving the bottlenecks, <span style=\"color:#F2D65C;\">not just supplying the hours.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" data-screen-label=\"Why Sri Lanka\" style=\"border-top:1px solid rgba(150,180,220,0.35);padding:clamp(56px,8vw,104px) clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:clamp(32px,5vw,56px);scroll-margin-top:72px;\">\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;\"><span style=\"color:#F2D65C;\">// Why Sri Lanka<\u002Fspan><span style=\"color:#7A8BAA;\">Sec. D<\u002Fspan><\u002Fdiv>\n<h2 data-reveal=\"true\" style=\"margin:0;font-size:clamp(34px,4.6vw,56px);line-height:1;font-weight:500;letter-spacing:-0.015em;text-wrap:balance;\">A new country, built for this work.<\u002Fh2>\n<div data-reveal=\"true\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;\">\n<sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"6\">\n<div style=\"position:relative;border:1px solid rgba(150,180,220,0.3);background:rgba(14,26,46,0.6);padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;\">\n<div style=\"display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;\"><span style=\"color:#F2D65C;\">D.{{ t.code }}<\u002Fspan><span style=\"width:10px;height:10px;border-top:1px solid #7A8BAA;border-right:1px solid #7A8BAA;\"><\u002Fspan><\u002Fdiv>\n<div style=\"font-size:24px;line-height:1.12;font-weight:500;text-wrap:balance;\">{{ t.title }}<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;line-height:1.5;color:#93A3BC;text-wrap:pretty;\">{{ t.copy }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"deepresearch\" data-screen-label=\"For DeepResearch\" style=\"border-top:1px solid rgba(150,180,220,0.35);padding:clamp(40px,6vw,72px) clamp(12px,3vw,32px);background:#0E1B31;scroll-margin-top:72px;\">\n<div style=\"position:relative;border:1px solid #7CF5B0;padding:clamp(32px,6vw,80px) clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:clamp(36px,5vw,64px);background-image:linear-gradient(rgba(124,245,176,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(124,245,176,0.05) 1px,transparent 1px);background-size:48px 48px;\">\n<div style=\"position:absolute;top:-9px;left:-9px;width:18px;height:18px;\"><div style=\"position:absolute;left:8px;top:0;width:1px;height:18px;background:#7CF5B0;\"><\u002Fdiv><div style=\"position:absolute;top:8px;left:0;height:1px;width:18px;background:#7CF5B0;\"><\u002Fdiv><\u002Fdiv><div style=\"position:absolute;top:-9px;right:-9px;width:18px;height:18px;\"><div style=\"position:absolute;left:8px;top:0;width:1px;height:18px;background:#7CF5B0;\"><\u002Fdiv><div style=\"position:absolute;top:8px;left:0;height:1px;width:18px;background:#7CF5B0;\"><\u002Fdiv><\u002Fdiv><div style=\"position:absolute;bottom:-9px;left:-9px;width:18px;height:18px;\"><div style=\"position:absolute;left:8px;top:0;width:1px;height:18px;background:#7CF5B0;\"><\u002Fdiv><div style=\"position:absolute;top:8px;left:0;height:1px;width:18px;background:#7CF5B0;\"><\u002Fdiv><\u002Fdiv><div style=\"position:absolute;bottom:-9px;right:-9px;width:18px;height:18px;\"><div style=\"position:absolute;left:8px;top:0;width:1px;height:18px;background:#7CF5B0;\"><\u002Fdiv><div style=\"position:absolute;top:8px;left:0;height:1px;width:18px;background:#7CF5B0;\"><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;\"><span style=\"color:#F2D65C;\">For DeepResearch<\u002Fspan><span style=\"color:#7CF5B0;\">Sec. E<\u002Fspan><\u002Fdiv>\n<div data-reveal=\"true\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,64px);align-items:start;\">\n<h2 style=\"margin:0;font-size:clamp(34px,4.6vw,58px);line-height:1.02;font-weight:500;letter-spacing:-0.015em;text-wrap:balance;\">Your Sri Lanka Data Partner, with capital, a facility and a hardware team attached.<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(124,245,176,0.4);\">\n<div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid rgba(150,180,220,0.2);\"><div style=\"width:8px;height:8px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:20px;line-height:1.4;\">Your devices, your software, your process. No new product, just execution.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid rgba(150,180,220,0.2);\"><div style=\"width:8px;height:8px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:20px;line-height:1.4;\">A new country for dataset diversity.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:16px;padding:18px 0;\"><div style=\"width:8px;height:8px;background:#7CF5B0;margin-top:8px;flex:none;\"><\u002Fdiv><span style=\"font-size:20px;line-height:1.4;\">An in-house engineering team to extend you into tactile, force and bimanual data, with rigs co-developed with your customer-facing team.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:stretch;\">\n<div data-reveal=\"true\" style=\"flex:1 1 340px;min-width:0;border:1px solid rgba(124,245,176,0.5);background:#0B1424;display:flex;flex-direction:column;\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(124,245,176,0.3);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;\"><span style=\"color:#F2D65C;\">ALREADY COMMITTED<\u002Fspan><span style=\"color:#7A8BAA;\">E.A<\u002Fspan><\u002Fdiv>\n<div style=\"padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:32px;flex:1;\">\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"font-size:clamp(52px,7vw,92px);line-height:.9;font-weight:500;letter-spacing:-0.02em;color:#7CF5B0;\">$30,000<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;color:#DCE6F2;\">COMMITTED CAPITAL<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px;\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#7A8BAA;padding-bottom:6px;border-bottom:1px solid rgba(150,180,220,0.3);\">ALLOCATED IN THREE PHASES<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;padding-top:4px;\">PHASE A<\u002Fspan><span style=\"font-size:17px;line-height:1.45;\">Facility conversion and a high-speed data uplink.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid rgba(150,180,220,0.15);\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;padding-top:4px;\">PHASE B<\u002Fspan><span style=\"font-size:17px;line-height:1.45;\">Recruiting and onboarding the first cohort of local experts.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:14px 0;\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#F2D65C;padding-top:4px;\">PHASE C<\u002Fspan><span style=\"font-size:17px;line-height:1.45;\">Designing and building the first custom capture rigs.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div data-reveal=\"true\" style=\"flex:1.7 1 520px;min-width:0;border:1px solid rgba(124,245,176,0.5);background:#0B1424;display:flex;flex-direction:column;\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(124,245,176,0.3);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;\"><span style=\"color:#F2D65C;\">ALREADY COMMITTED<\u002Fspan><span style=\"color:#7A8BAA;\">E.B<\u002Fspan><\u002Fdiv>\n<div style=\"padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:28px;flex:1;\">\n<div style=\"display:flex;flex-wrap:wrap;gap:24px 40px;align-items:end;justify-content:space-between;\">\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div style=\"font-size:clamp(52px,7vw,92px);line-height:.9;font-weight:500;letter-spacing:-0.02em;color:#7CF5B0;\">3,500 SQ FT<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;color:#DCE6F2;\">WAREHOUSE · SRI LANKA<\u002Fdiv><\u002Fdiv>\n<p style=\"margin:0;flex:1 1 300px;font-size:17px;line-height:1.5;color:#93A3BC;text-wrap:pretty;\">Available now and ready to convert into the data house: a staging, calibration and QC hub for field capture, plus modular capture environments (kitchen, workshop, light-assembly) for engineered capture.<\u002Fp>\n<\u002Fdiv>\n<div style=\"position:relative;border:1px solid rgba(150,180,220,0.3);display:flex;flex-direction:column;\">\n<div style=\"display:flex;justify-content:space-between;gap:12px;padding:12px 16px 0;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:#7A8BAA;\"><span>DETAIL E.B — FLOOR PLAN<\u002Fspan><span style=\"color:#F2D65C;\">ISOMETRIC · NTS<\u002Fspan><\u002Fdiv>\n<div style=\"padding:12px clamp(8px,2vw,24px) 16px;\">{{ facilityFig }}<\u002Fdiv>\n<div style=\"display:gri
